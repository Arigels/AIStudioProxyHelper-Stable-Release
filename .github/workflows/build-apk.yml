name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 固定签名密钥：缓存 debug keystore，保证每次构建签名一致，后续更新可直接覆盖安装
      - name: Restore stable signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AIStudioProxyHelper-v2.6.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioProxyHelper-APK
          path: dist/AIStudioProxyHelper-v2.6.0.apk
          retention-days: 30

      - name: Publish GitHub Release (Formal APK only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.6.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AIStudioProxyHelper-v2.6.0.apk --clobber
          else
            gh release create "$TAG" dist/AIStudioProxyHelper-v2.6.0.apk \
              --title "v2.6.0 — AI Studio 反代助手（全面排查修复版）" \
              --notes "① 首次打开弹窗提示反代账号风控风险、免责声明及开源免费禁止贩卖；② 彻底修复悬浮窗授权误跳无障碍、授权后状态不同步问题；③ 彻底隔离 AI 书签（自定义 / 本地反代）的模型列表与调用路径（含悬浮窗报错单次直出分析、不再串用）；④ 修复一键部署仍被无障碍拦截、「启动反代」提前出现、保存设置收起面板等全部遗留问题。"
          fi
