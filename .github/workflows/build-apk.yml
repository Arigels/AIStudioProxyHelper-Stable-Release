name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 固定签名密钥：缓存 debug keystore，保证每次构建签名一致，后续更新可直接覆盖安装
      - name: Restore stable signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AIStudioProxyHelper-v2.5.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioProxyHelper-APK
          path: dist/AIStudioProxyHelper-v2.5.0.apk
          retention-days: 30

      - name: Publish GitHub Release (Formal APK only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.5.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AIStudioProxyHelper-v2.5.0.apk --clobber
          else
            gh release create "$TAG" dist/AIStudioProxyHelper-v2.5.0.apk \
              --title "v2.5.0 — AI Studio 反代助手（三页版）" \
              --notes "界面重排：三页「反代 / 账号 / 解疑」。启动反代与拉取模型移到反代页；AI 助手移入解疑页底部，并新增「外接模型 / 本地反代」两个书签，严格单一路径调用。悬浮窗权限状态改为自动刷新。移除解除限制引导，改为提示按系统提示解除。"
          fi
