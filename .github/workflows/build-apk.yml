name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 固定签名密钥：缓存 debug keystore，保证每次构建签名一致，后续更新可直接覆盖安装
      - name: Restore stable signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AIStudioProxyHelper-v1.6.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioProxyHelper-APK
          path: dist/AIStudioProxyHelper-v1.6.0.apk
          retention-days: 30

      - name: Publish GitHub Release (Formal APK only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.6.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AIStudioProxyHelper-v1.6.0.apk --clobber
          else
            gh release create "$TAG" dist/AIStudioProxyHelper-v1.6.0.apk \
              --title "v1.6.0 — AI Studio 反代助手（AI 排障版）" \
              --notes "新增 AI 排障助手：填入自己的 OpenAI 兼容接口后，AI 可通过受限工具（查状态、读日志、执行命令、改端口、启停服务）自动排查反代部署问题；同时新增本地日志回传与报错翻译器。"
          fi
