name: Build Android APK

on:
  push:
    branches: [ main, master, fix/cookie-guide ]
  pull_request:
    branches: [ main, master, fix/cookie-guide ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 固定正式签名证书（优先使用 GitHub Secrets；未配置则生成并缓存正式 Release Keystore，告别 Android Debug 证书）
      - name: Restore release keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.keystore
          key: android-release-keystore-v1

      - name: Prepare Release Keystore
        env:
          SECRET_KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.keystore"
          KS_FILE="$HOME/.keystore/release.jks"
          ENV_FILE="$HOME/.keystore/release.env"
          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ]; then
            echo "$SECRET_KS_B64" | base64 -d > "$KS_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${SECRET_KEY_PASS:-$SECRET_KS_PASS}" >> "$GITHUB_ENV"
          elif [ -f "$KS_FILE" ] && [ -f "$ENV_FILE" ]; then
            # shellcheck disable=SC1090
            source "$ENV_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            RAND_PASS="$(openssl rand -hex 24)"
            ALIAS_NAME="aistudio_release"
            rm -f "$KS_FILE"
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$ALIAS_NAME" \
              -storepass "$RAND_PASS" \
              -keypass "$RAND_PASS" \
              -dname "CN=AIStudioProxyHelper, OU=OpenSource, O=Arigels, C=CN" >/dev/null 2>&1
            chmod 600 "$KS_FILE"
            printf 'KS_PASS=%s\nKEY_ALIAS=%s\n' "$RAND_PASS" "$ALIAS_NAME" > "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$RAND_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$RAND_PASS" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK Signing Certificate
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner:|Issuer:|SHA256:" || true

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AIStudioProxyHelper-v2.6.17.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioProxyHelper-APK
          path: dist/AIStudioProxyHelper-v2.6.17.apk
          retention-days: 30

      - name: Publish GitHub Release (Formal APK only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/cookie-guide'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.6.17-preview.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AIStudioProxyHelper-v2.6.17.apk --clobber
          else
            gh release create "$TAG" dist/AIStudioProxyHelper-v2.6.17.apk \
              --title "v2.6.17 — 修复引导迁移与浏览器跳转、Cookie预检与频繁掉线提醒" \
              --notes "1. P0-1 修复引导状态迁移：引入 guide_schema=2，按实际证据重算状态，不再照搬旧 cookie_max_stage，未部署过强制回退第 1 步；增加证据闸门，剪贴板无真实 Cookie 或未手动确认不进入粘贴步；2. P0-2 修复打开 AI Studio 跳转：取消二次确认卡，一次点击直达浏览器；定向打开失败自动回退并给出红字提示，所有失败路径均自动复制链接兜底；3. P0-3 剪贴板检测降级与手动主路径：第 4 步突出醒目的「已经导出好了，去粘贴 →」主按钮；复制 AI Studio 链接时若剪贴板已有 Cookie 则弹窗确认防止覆盖；第 5 步「打开 App 并读取剪贴板」改在前台可靠读取；4. P0-4 Cookie 结构预检与错误翻译：导入前本地纯离线预检 JSON、登录态核心字段与 Google 域名，拦截复制成网址或被截断的情况；服务端 401/未检测到账号错误自动转为排查清单；5. P1 频繁掉线提醒：10 分钟掉线 3 次或 30 分钟累计离线 90 秒自动在断线卡提示「把 Termux 拉成小窗并关闭电池优化」，用户点「知道了」后 7 天不再重复提示，手动停止不计入。"
          fi
