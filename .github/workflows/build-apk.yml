name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 固定正式签名证书（优先使用 GitHub Secrets；未配置则生成并缓存正式 Release Keystore，告别 Android Debug 证书）
      - name: Restore release keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.keystore
          key: android-release-keystore-v1

      - name: Prepare Release Keystore
        env:
          SECRET_KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.keystore"
          KS_FILE="$HOME/.keystore/release.jks"
          ENV_FILE="$HOME/.keystore/release.env"
          if [ -n "$SECRET_KS_B64" ] && [ -n "$SECRET_KS_PASS" ] && [ -n "$SECRET_KEY_ALIAS" ]; then
            echo "$SECRET_KS_B64" | base64 -d > "$KS_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$SECRET_KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${SECRET_KEY_PASS:-$SECRET_KS_PASS}" >> "$GITHUB_ENV"
          elif [ -f "$KS_FILE" ] && [ -f "$ENV_FILE" ]; then
            # shellcheck disable=SC1090
            source "$ENV_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            RAND_PASS="$(openssl rand -hex 24)"
            ALIAS_NAME="aistudio_release"
            rm -f "$KS_FILE"
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$ALIAS_NAME" \
              -storepass "$RAND_PASS" \
              -keypass "$RAND_PASS" \
              -dname "CN=AIStudioProxyHelper, OU=OpenSource, O=Arigels, C=CN" >/dev/null 2>&1
            chmod 600 "$KS_FILE"
            printf 'KS_PASS=%s\nKEY_ALIAS=%s\n' "$RAND_PASS" "$ALIAS_NAME" > "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KS_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$RAND_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$RAND_PASS" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK Signing Certificate
        run: |
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E "Owner:|Issuer:|SHA256:" || true

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AIStudioProxyHelper-v2.6.6.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioProxyHelper-APK
          path: dist/AIStudioProxyHelper-v2.6.6.apk
          retention-days: 30

      - name: Publish GitHub Release (Formal APK only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.6.6"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AIStudioProxyHelper-v2.6.6.apk --clobber
          else
            gh release create "$TAG" dist/AIStudioProxyHelper-v2.6.6.apk \
              --title "v2.6.6 — 账号页实时额度检测、可用模型与每日额度对照表、常驻后台提醒" \
              --notes "1. 账号页新增「实时额度检测」：同步 AI Studio Proxy 管理平台实时今日调用次数、Token 消耗、429 冷却状态与美西 00:00 PST 重置倒计时；2. 展示每个账号可用模型列表、单模型配额进度条，并支持在 App 内直接激活/启停/重置 429/探测等级；3. 同步管理平台 config.yaml 的各订阅等级（Free/Plus/Pro/Ultra/Ultra_20X）每日额度对照表与付费准入规则；4. 在反代页与解疑页明确提示部署完成后可直接关闭本 App，仅需保持 Termux 与 VPN 运行。"
          fi
