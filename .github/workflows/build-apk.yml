name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 固定签名密钥：缓存 debug keystore，保证每次构建签名一致，后续更新可直接覆盖安装
      - name: Restore stable signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AIStudioProxyHelper-v2.6.3.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioProxyHelper-APK
          path: dist/AIStudioProxyHelper-v2.6.3.apk
          retention-days: 30

      - name: Publish GitHub Release (Formal APK only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.6.3"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AIStudioProxyHelper-v2.6.3.apk --clobber
          else
            gh release create "$TAG" dist/AIStudioProxyHelper-v2.6.3.apk \
              --title "v2.6.3 — 账号页浏览器自动识别与排版修复 & 稳定性修复" \
              --notes "1. 账号页自动识别已安装浏览器（Edge / 火狐及其 Beta/Nightly），仅展示对应扩展链接复制按钮，修复火狐复制按钮挤压竖排的问题；2. 修复 LogCollector 读取 UTF-8 日志超时丢日志、ProgressTracker 误判 403/oom、悬浮窗在线后仍显示旧报错、Agent JSON null 字段及窄屏按钮换行等高影响问题。"
          fi
